version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: crmPostgres
    environment:
      POSTGRES_USER: corrus
      POSTGRES_PASSWORD: corrus
      POSTGRES_DB: crm_db
      PGDATA: /var/lib/postgresql/data/crm_datas
    ports:
      - "5432:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: crmPgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  crm_postgres_data: